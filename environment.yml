# Single conda environment for the whole project.
# The optimization stack (Python, pyomo, idaes-pse, scip, highspy) ships its
# binaries through conda-forge; the editable package and its remaining Python
# dependencies (including the pip-only `eeco`) are installed by pip in the
# `pip:` subsection below, so `conda env create` is the only install command.
# Usage: conda env create -f environment.yml
name: flex-pse
channels:
  - conda-forge
dependencies:
  - python=3.13
  - scip=10.0
  - highspy=1.15
  - pip
  - pip:
      - -e .[dev]
