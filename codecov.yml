coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

flags:
  unit:
    paths:
      - src
    carryforward: false
  integration:
    paths:
      - src
    carryforward: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  after_n_builds: 1

ignore:
  - "examples"
  - "docs"
  - "**/tests/**"

codecov:
  notify:
    after_n_builds: 1  # the single coverage upload from ci.yml unit-tests
    wait_for_ci: false
  require_ci_to_pass: false