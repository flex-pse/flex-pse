  #   name: standard-install (py${{ matrix.python-version }})
  #   needs: lint
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       python-version: ["3.11", "3.12", "3.13","3.14"]
  #   steps:
  #     # No checkout: install from the remote git ref exactly as an end user
  #     # would (pip install "git+<repo>@<ref>"), unlike the editable `-e` used by
  #     # the dev/test jobs. This builds and installs over the network, so a
  #     # subpackage missing from setuptools package discovery (a dropped
  #     # __init__.py, M00 Pitfall #1) or a needed file left uncommitted is
  #     # silently absent from the distribution and fails here rather than in a
  #     # later milestone. On pull_request, github.ref is the PR merge ref
  #     # (refs/pull/<n>/merge), which pip fetches directly.
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ matrix.python-version }}
  #     - run: pip install "git+${{ format('{0}/{1}@{2}', github.server_url, github.repository, github.ref) }}"
  #     # Run from a scratch dir (no repo checkout exists) so the *installed*
  #     # package is exercised.
