name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: lint-imports

  fast-tests:
    name: fast-tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python matrix on Linux; a single representative version on
        # macOS/Windows to confirm cross-OS behavior without paying the 10x
        # (macOS) / 2x (Windows) runner-minute multipliers on every version.
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,solvers]"
      - uses: ./.github/actions/setup-ipopt
      - run: pytest -m "unit or component" --cov --cov-report=xml

  # TODO: uncomment this job once the repo is public. It installs from the
  # remote git ref (git+https://…), which only works unauthenticated on a public
  # repo; until then it would fail on every PR. When re-enabling, verify the
  # git+@refs/pull/<n>/merge fetch resolves on a real PR (untested to date).
