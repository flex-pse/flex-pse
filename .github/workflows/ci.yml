name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: lint-imports

  unit-tests:
    name: unit-tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python matrix on Linux; a single representative version on
        # macOS/Windows to confirm cross-OS behavior without paying the 10x
        # (macOS) / 2x (Windows) runner-minute multipliers on every version.
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,solvers]"
      - uses: ./.github/actions/setup-ipopt
      - run: pytest -m "unit or component" --cov --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
  coverage-floors:
    name: coverage-floors
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # cyipopt has no PyPI wheel (source-only) and its C extension build
      # needs a pkg-config-discoverable system IPOPT -- the IDAES binary
      # setup-ipopt installs below is a standalone executable, not a
      # dev/headers install, so it can't satisfy this on its own. liblapack
      # -dev/libblas-dev are needed too: coinor-libipopt-dev's pkg-config
      # file links -llapack/-lblas, and Ubuntu's runtime liblapack3/libblas3
      # packages ship only the versioned .so.3, not the unversioned .so link
      # name the linker needs for -l.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            coinor-libipopt1v5 coinor-libipopt-dev liblapack-dev libblas-dev
      - run: pip install -e ".[dev,solvers,parameterize,greybox]"
      - uses: ./.github/actions/setup-ipopt
      # All tiers combined (unit+component+integration), one run: per-subpackage
      # floors are actual - 2%, rounded down, from the coverage this suite
      # reports as of M15 (94/96/82/100 -> 92/94/80/98). Denominator excludes
      # */tests/* and flexops/testing/ (pyproject.toml [tool.coverage.run]).
      # The [parameterize] extra (scikit-learn) must be installed here so this
      # job's environment matches the one the flexparameterize floor was
      # calibrated against -- without it, LinearRegressor's real fit path never
      # executes and flexparameterize coverage reads ~5pp low (82% -> 77%).
      # [greybox] (cyipopt, torch) is needed here too: this job is pinned to
      # py3.13 (torch publishes wheels for it) and is the job that enforces the
      # flexops floor -- without torch/cyipopt installed, TorchDriver and the
      # grey-box adapter report 0% and drop flexops below its floor. The
      # standard-install job below stays bare on purpose (proves the optional
      # dependency stays optional, memory flex-pse-dependency-packaging).
      - run: pytest -q --cov=flexcore --cov=flexops --cov=flexparameterize --cov=flexschedule
      - run: coverage report --include="src/flexcore/*" --fail-under=92
      - run: coverage report --include="src/flexops/*" --fail-under=94
      - run: coverage report --include="src/flexparameterize/*" --fail-under=80
      - run: coverage report --include="src/flexschedule/*" --fail-under=98

  standard-install:
    name: standard-install (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13","3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "git+${{ format('{0}/{1}@{2}', github.server_url, github.repository, github.ref) }}"
      # Run from a scratch dir (no repo checkout exists) so the *installed*
      # package is exercised.
      - working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib
  
          modules = [
              "flexcore", "flexcore.config", "flexcore.solvers",
              "flexops", "flexops.core", "flexops.unit_models",
              "flexops.unit_models.base", "flexops.logic", "flexops.costing",
              "flexops.costing.unit_models", "flexops.design",
              "flexops.properties",
              "flexparameterize", "flexparameterize.regression",
              "flexschedule",
          ]
          for name in modules:
              importlib.import_module(name)
          print(f"OK: imported {len(modules)} modules from the installed wheel")
          PY
      # flexops.testing imports pytest, so it needs the `testing` extra; the
      # bare install above deliberately does not carry it.
      - run: pip install "flex-pse[testing] @ git+${{ format('{0}/{1}@{2}', github.server_url, github.repository, github.ref) }}"
      - working-directory: ${{ runner.temp }}
        run: |
          python -c "import flexops.testing; print('OK: flexops.testing with the [testing] extra')"

  integration:
    name: integration (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # See unit-tests: full Python matrix on Linux, one version elsewhere.
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,solvers]"
      - uses: ./.github/actions/setup-ipopt
      # The integration set is empty until M12; pytest exits 5 (no tests
      # collected) in that case, which is treated as success so this job is
      # structural from day one rather than aspirational. `shell: bash` forces
      # Git Bash on the Windows runner so this script is identical on all OSes.
      - shell: bash
        run: |
          set +e
          pytest -m integration --cov --cov-report=xml
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 5 ]; then
            exit 0
          fi
          exit "$exit_code"
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
