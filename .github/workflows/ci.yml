name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job waits on lint; it blocks merges as a required check instead.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: lint-imports

  unit-tests:
    name: unit-tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python matrix on Linux; a single representative version on
        # macOS/Windows to confirm cross-OS behavior without paying the 10x
        # (macOS) / 2x (Windows) runner-minute multipliers on every version.
        # The ubuntu/3.13 entry is the single coverage run.
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13", coverage: true }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # The coverage run adds the [parameterize] extra (scikit-learn) because
      # the flexparameterize floor was calibrated with it -- without it,
      # LinearRegressor's real fit path never executes and flexparameterize
      # coverage reads ~5pp low (82% -> 77%).
      - name: Install
        shell: bash
        run: |
          extras="dev,solvers"
          if [ "${{ matrix.coverage }}" = "true" ]; then extras="$extras,parameterize"; fi
          uv pip install --system -e ".[$extras]"
      - uses: ./.github/actions/setup-ipopt

      - name: Tests (unit + component, no coverage)
        if: ${{ !matrix.coverage }}
        run: pytest -n auto -m "unit or component"

      # All tiers combined (unit+component+integration), one run: per-subpackage
      # floors are actual - 2%, rounded down, from the coverage this suite
      # reports as of M15 (94/96/82/100 -> 92/94/80/98). Denominator excludes
      # */tests/* and flexops/testing/ (pyproject.toml [tool.coverage.run]).
      - name: Tests (all tiers, with coverage)
        if: ${{ matrix.coverage }}
        run: >-
          pytest -n auto
          --cov=flexcore --cov=flexops --cov=flexparameterize --cov=flexschedule
          --cov-report=xml --cov-report=term
      - name: Coverage floors
        if: ${{ matrix.coverage }}
        run: |
          coverage report --include="src/flexcore/*" --fail-under=92
          coverage report --include="src/flexops/*" --fail-under=94
          coverage report --include="src/flexparameterize/*" --fail-under=80
          coverage report --include="src/flexschedule/*" --fail-under=98
      # The only Codecov upload; keep codecov.yml's after_n_builds in step.
      - if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev,solvers]"
      - uses: ./.github/actions/setup-ipopt
      # The integration set is empty until M12; pytest exits 5 (no tests
      # collected) in that case, which is treated as success so this job is
      # structural from day one rather than aspirational. When M12 lands:
      # restore the OS/Python matrix, drop integration from the coverage run
      # above, add --cov and a Codecov upload (flags: integration) here, and
      # raise codecov.yml's after_n_builds to match.
      - shell: bash
        run: |
          set +e
          pytest -m integration
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 5 ]; then exit 0; fi
          exit "$exit_code"

  build-wheel:
    name: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  standard-install:
    name: standard-install (py${{ matrix.python-version }})
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No checkout here, so no cache-dependency-glob to key on.
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: ${{ runner.temp }}/dist
      - name: Install the wheel (no extras)
        shell: bash
        run: uv pip install --system "$(ls "$RUNNER_TEMP"/dist/*.whl)"
      # Run from a scratch dir (no repo checkout exists) so the *installed*
      # package is exercised.
      - working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "flexcore", "flexcore.config", "flexcore.solvers",
              "flexops", "flexops.core", "flexops.unit_models",
              "flexops.unit_models.base", "flexops.logic", "flexops.costing",
              "flexops.costing.unit_models", "flexops.design",
              "flexops.properties",
              "flexparameterize", "flexparameterize.regression",
              "flexschedule",
          ]
          for name in modules:
              importlib.import_module(name)
          print(f"OK: imported {len(modules)} modules from the installed wheel")
          PY
      # flexops.testing imports pytest, so it needs the `testing` extra; the
      # bare install above deliberately does not carry it.
      - name: Install with the [testing] extra
        shell: bash
        run: uv pip install --system "$(ls "$RUNNER_TEMP"/dist/*.whl)[testing]"
      - working-directory: ${{ runner.temp }}
        run: |
          python -c "import flexops.testing; print('OK: flexops.testing with the [testing] extra')"
