  #       run: |
  #         python - <<'PY'
  #         import importlib
  #
  #         modules = [
  #             "flexcore", "flexcore.config", "flexcore.solvers",
  #             "flexops", "flexops.core", "flexops.unit_models",
  #             "flexops.unit_models.base", "flexops.logic", "flexops.costing",
  #             "flexops.costing.unit_models", "flexops.design",
  #             "flexops.properties", "flexops.testing",
  #             "flexparameterize", "flexparameterize.regression",
  #             "flexschedule",
  #         ]
  #         for name in modules:
  #             importlib.import_module(name)
  #         print(f"OK: imported {len(modules)} modules from the installed wheel")
  #         PY

  integration:
    name: integration (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # See fast-tests: full Python matrix on Linux, one version elsewhere.
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,solvers]"
      - uses: ./.github/actions/setup-ipopt
      # The integration set is empty until M12; pytest exits 5 (no tests
      # collected) in that case, which is treated as success so this job is
      # structural from day one rather than aspirational. `shell: bash` forces
      # Git Bash on the Windows runner so this script is identical on all OSes.
      - shell: bash
        run: |
          set +e
          pytest -m integration --cov --cov-report=xml
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 5 ]; then
            exit 0
          fi
          exit "$exit_code"
