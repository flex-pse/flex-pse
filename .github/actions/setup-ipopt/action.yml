name: setup-ipopt
description: >-
  Install the IDAES binary extensions (IPOPT) and put them on PATH, caching the
  binary directory keyed on OS + idaes version.

runs:
  using: composite
  steps:
    # The IDAES ubuntu2204 build links LAPACK/BLAS/gfortran dynamically and the
    # ubuntu-24.04 runner image does not ship them, so ipopt exits 127 with
    # "liblapack.so.3: cannot open shared object file". Runs on every job (not
    # just a cache miss) because these are system packages, not cached files.
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          liblapack3 libblas3 libgfortran5 libgomp1 libquadmath0

    # idaes must already be installed (pip install -e .) so we can ask it where
    # its binaries live: ~/.idaes/bin on Linux/macOS, %LOCALAPPDATA%\idaes\bin
    # on Windows.
    - id: bindir
      shell: bash
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import idaes
        print(f"path={idaes.bin_directory}")
        print(f"version={idaes.__version__}")
        PY

    - id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.bindir.outputs.path }}
        key: idaes-bin-${{ runner.os }}-${{ steps.bindir.outputs.version }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: idaes get-extensions --verbose

    # `import idaes` prepends the bin directory to PATH inside the Python
    # process, but pytest plugins and any subprocess started before that import
    # would not see it; exporting it here makes `ipopt` resolvable job-wide.
    - shell: bash
      run: echo "${{ steps.bindir.outputs.path }}" >> "$GITHUB_PATH"
