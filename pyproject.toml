[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-pse"
version = "0.0.1.dev0"
description = "Industrial energy-flexibility optimization platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache 2.0" }
dependencies = [
    "idaes-pse==2.12.0",
    "pyomo==6.10.1",
    "eeco==0.2.1",
    "pandas",
    "pydantic>=2",
    "python-dateutil",
]
# Dependency policy (decision R12, plan/01_architecture.md §2.1): idaes-pse,
# pyomo, and eeco are pinned to exact tested versions on purpose, with no
# compat/isolation layer -- all three are imported directly at point of use.
# Maintainers bump these pins manually, roughly quarterly, only after the full
# test suite passes against the newer versions.

[project.optional-dependencies]
parameterize = ["pandas>=2.0"]
# HiGHS ships as a self-contained wheel; IPOPT does not (see
# .github/actions/setup-ipopt and docs installation notes).
solvers = ["highspy"]
dev = ["pytest", "pytest-cov", "import-linter", "ruff", "black", "pre-commit", "diff-cover", "marimo", "matplotlib"]
docs = ["sphinx", "myst-nb", "furo"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["src"]
markers = [
    "unit: fast (<1s), no-solver tests; the TDD inner loop",
    "component: solves small models (<=~100 timesteps) with HiGHS/IPOPT only",
    "integration: end-to-end tests (minutes); any solver",
    "needs_highs: skip if the HiGHS solver is unavailable",
    "needs_ipopt: skip if the IPOPT solver is unavailable",
    "needs_cbc: skip if the CBC solver is unavailable",
    "needs_gurobi: skip if the Gurobi solver is unavailable",
    "needs_scip: skip if the SCIP solver is unavailable",
]

[tool.ruff]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
pydocstyle.convention = "google"

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "examples/"
