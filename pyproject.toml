[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-pse"
version = "0.1.0"
description = "Industrial energy-flexibility optimization platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "idaes-pse==2.12.0",
    "pyomo==6.10.1",
    "eeco==0.4.0",
    "pandas",
    "pydantic>=2",
    "python-dateutil",
]
# Dependency policy (decision R12, plan/01_architecture.md §2.1): idaes-pse,
# pyomo, and eeco are pinned to exact tested versions on purpose, with no
# compat/isolation layer -- all three are imported directly at point of use.
# Maintainers bump these pins manually, roughly quarterly, only after the full
# test suite passes against the newer versions.

[project.urls]
Homepage = "https://github.com/flex-pse/flex-pse"
Documentation = "https://flex-pse.github.io/flex-pse/"
Repository = "https://github.com/flex-pse/flex-pse"
Changelog = "https://github.com/flex-pse/flex-pse/blob/main/CHANGELOG.md"

[project.optional-dependencies]
parameterize = ["pandas>=2.0", "scikit-learn>=1.3"]
# HiGHS ships as a self-contained wheel; IPOPT does not (see
# .github/actions/setup-ipopt and docs installation notes).
solvers = ["highspy"]
# `flexops.testing` (UnitModelTestHarness) imports pytest at runtime, so users
# subclassing the harness in their own test suites need this extra.
testing = ["pytest"]
dev = ["pytest", "pytest-cov", "import-linter", "ruff", "black", "pre-commit", "diff-cover", "marimo", "matplotlib", "jsonschema"]
docs = ["sphinx", "myst-parser", "furo"]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "src/flexops/testing/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flexcore = ["config/schemas/*.json", "py.typed"]
flexops = [
    "py.typed",
    "tests/fixtures/*.json",
    "tests/fixtures/*.csv",
    "tests/fixtures/api_freeze/*.json",
    "tests/fixtures/api_freeze/data/*.json",
]
flexparameterize = ["py.typed"]
flexschedule = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["src"]
markers = [
    "unit: fast (<1s), no-solver tests; the TDD inner loop",
    "component: solves small models (<=~100 timesteps) with HiGHS/IPOPT only",
    "integration: end-to-end tests (minutes); any solver",
    "needs_highs: skip if the HiGHS solver is unavailable",
    "needs_ipopt: skip if the IPOPT solver is unavailable",
    "needs_cbc: skip if the CBC solver is unavailable",
    "needs_gurobi: skip if the Gurobi solver is unavailable",
    "needs_scip: skip if the SCIP solver is unavailable",
]

[tool.ruff]
# The frozen-API script is a verbatim copy of the PLAN.md §2 snippet; formatting
# or import-sorting it would defeat the byte-for-byte tripwire.
extend-exclude = ["src/flexops/tests/fixtures/api_freeze"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
pydocstyle.convention = "google"

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "src/flexops/tests/fixtures/api_freeze/"
