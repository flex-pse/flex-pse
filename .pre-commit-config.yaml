repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: conda run --no-capture-output -n flex-pse lint-imports
        language: system
        pass_filenames: false

      - id: pre-push-suite
        name: full test suite (pre-push)
        entry: conda run --no-capture-output -n flex-pse bash -c 'ruff check . && black --check . && lint-imports && pytest -q'
        language: system
        pass_filenames: false
        stages: [pre-push]
